name: Update Thresholds

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release even if the thresholds did not change (for code-only builds)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Compute thresholds
        env:
          # Persist state across runs via a committed file so the
          # population sanity guard works even though ./build is
          # ephemeral in CI.
          RR_STATE_PATH: scripts/state.json
        run: |
          mkdir -p build
          # Raider.IO times out often enough to lose a night's run to it, and a
          # missed run means the cutoffs stand still for a day. Each attempt
          # starts from scratch, so a partial fetch cannot carry over.
          for attempt in 1 2 3; do
            if RR_OUTPUT_DIR=./build python3 scripts/update_thresholds.py; then
              exit 0
            fi
            echo "attempt ${attempt} failed"
            sleep $((attempt * 30))
          done
          echo "::error::could not fetch thresholds after 3 attempts"
          exit 1

      - name: Patch addon Lua files
        run: python3 scripts/patch_addon.py RaiderRanked/RankSystem.lua build/thresholds.json

      - name: Check for changes
        id: diff
        run: |
          FILES="RaiderRanked/RankSystem.lua RaiderRanked/ScoreHistory.lua scripts/state.json"
          # Plain "&&" would return 1 here and abort the step under bash -e.
          if [ -f RaiderRanked/Cutoffs.lua ]; then
            FILES="$FILES RaiderRanked/Cutoffs.lua"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- $FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No threshold or season changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- $FILES
          fi

          # A manual dispatch can ship a code-only build that touched no thresholds.
          if ! git diff --quiet -- $FILES || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping upload."
          fi

      # The TOC's "## Version" is the single source of truth. Bump the minor by
      # hand when shipping a feature (1.11.4 -> 1.12.0); every automated release
      # increments the last component from wherever that leaves it.
      - name: Bump addon version
        if: steps.diff.outputs.release == 'true'
        id: version
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          toc = pathlib.Path("RaiderRanked/RaiderRanked.toc")
          # Bytes, not read_text: the TOC is CRLF and read_text(newline=...)
          # only exists from 3.13 on, so this keeps the line endings intact.
          raw = toc.read_bytes().decode("utf-8")

          m = re.search(r"^## Version:[ \t]*(.+?)[ \t]*\r?$", raw, re.M)
          if not m:
              raise SystemExit("no '## Version:' line in RaiderRanked.toc")

          parts = m.group(1).split(".")
          major = parts[0]
          minor = parts[1] if len(parts) > 1 else "0"
          patch = int(parts[2]) + 1 if len(parts) > 2 and parts[2].isdigit() else 1
          new = f"{major}.{minor}.{patch}"

          # Splice over the captured version only, so the line ending survives.
          start, end = m.span(1)
          toc.write_bytes((raw[:start] + new + raw[end:]).encode("utf-8"))

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={new}\n")
          print(f"version: {m.group(1)} -> {new}")
          PY

      # Committed locally only. Nothing is pushed or tagged until the upload has
      # gone through, so a failed upload leaves no half-released state behind:
      # the repository would otherwise claim a version that never shipped, and
      # a re-run would collide with its own tag.
      - name: Commit
        if: steps.diff.outputs.release == 'true'
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Catto"
          git config user.email "info@catto.at"
          git add ${{ steps.diff.outputs.files }} RaiderRanked/RaiderRanked.toc

          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            MSG="update thresholds $(date -u +'%Y-%m-%d') (v${VERSION})"
          else
            MSG="release v${VERSION}"
          fi

          git commit -m "$MSG"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package addon
        if: steps.diff.outputs.release == 'true'
        run: |
          zip -r RaiderRanked.zip RaiderRanked/ \
            -x "RaiderRanked/Tools/*" "RaiderRanked/Debug/*" "RaiderRanked/tests/*"

      - name: Upload to CurseForge
        if: steps.diff.outputs.release == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG=$(cat <<EOF
          Raider Ranked ${VERSION}
          Author: Catto <info@catto.at>
          Date: $(date -u +'%A, %B %d, %Y, %H:%M UTC')
          commit ${{ steps.commit.outputs.hash }}
          ${{ steps.commit.outputs.msg }}
          EOF
          )

          METADATA=$(jq -cn \
            --arg cl "$CHANGELOG" \
            --arg v "$VERSION" \
            --argjson gv "[${{ vars.CF_GAME_VERSIONS }}]" \
            '{changelog: $cl, changelogType: "text", displayName: ("Raider Ranked " + $v), gameVersions: $gv, releaseType: "release"}')

          # Their upload endpoint returns a 500 often enough to be worth sitting
          # out. The response body carries the actual reason, which -f throws
          # away, so the status is read separately and the body always printed.
          for attempt in 1 2 3 4; do
            STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST \
              "https://wow.curseforge.com/api/projects/${{ vars.CF_PROJECT_ID }}/upload-file" \
              -H "X-Api-Token: $CF_API_TOKEN" \
              -F "metadata=$METADATA" \
              -F "file=@RaiderRanked.zip")

            echo "attempt ${attempt}: HTTP ${STATUS}"
            cat response.json; echo

            case "$STATUS" in
              2*) exit 0 ;;
              # Anything they reject outright will be rejected again, so only
              # server-side failures are worth another try.
              5*|000) sleep $((attempt * 20)) ;;
              *) echo "::error::CurseForge rejected the upload (HTTP ${STATUS})"; exit 1 ;;
            esac
          done

          echo "::error::CurseForge upload failed after 4 attempts"
          exit 1

      - name: Push commit and tag
        if: steps.diff.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Rebase before pushing: a manual push during the run would otherwise
          # reject this one, which is how a release once ended up published but
          # unrecorded. The tag is cut after the rebase so it names the commit
          # that actually lands.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git tag -f "v${VERSION}"
            if git push origin HEAD; then
              git push origin "v${VERSION}"
              exit 0
            fi
            echo "push rejected, retrying"
          done

          echo "::error::could not push the release commit"
          exit 1
